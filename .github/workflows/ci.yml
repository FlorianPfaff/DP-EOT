name: CI and benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plot]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test corrected finite-resolution study
        env:
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m dpeot.experiments.export_group_value_study \
            --stage pilot --num-trials 1 --workers 2 \
            --conditions crossing_r2 three_targets near_miss parallel \
            --output-dir results/group_value_v1/ci_smoke

      - name: Run legacy two-target demonstration
        run: |
          python -m dpeot.experiments.export_two_target_benchmark \
            --num-trials 100 \
            --base-seed 7 \
            --output-dir results/legacy

      - name: Run detector negative controls
        run: |
          python -m dpeot.experiments.export_negative_controls \
            --num-trials 100 \
            --base-seed 11000 \
            --output-dir results/legacy

      - name: Run detector threshold sweep
        run: |
          python -m dpeot.experiments.export_detector_threshold_sweep \
            --num-trials 25 \
            --base-seed 13000 \
            --output-dir results/legacy/detector_threshold_sweep \
            --figure-dir figures

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/
            figures/detector_threshold_sweep.png
